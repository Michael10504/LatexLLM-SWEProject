<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LaTeX Local LLM Editor</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:3443;">
    <link rel="stylesheet" href="./styles.css">

</head>

<body>
    <div id="status-bar">
        <span id="user-status">User: Not Logged In</span>
        <span style="margin-left: auto;">
            <button id="logout-btn"
                style="display: none; padding: 4px 12px; background: #c53030; color: white; border: none; border-radius: 3px; cursor: pointer;">Logout</button>
        </span>
    </div>

    <div id="editor-view">
        <h2>Editor View</h2>
    </div>

    <div id="pdf-preview">
        <h2>PDF Preview</h2>
    </div>

    <div id="ai-panel">
        <h2>AI Panel</h2>
        <button id="ping-btn" style="margin-top: 20px; padding: 8px;">Test IPC Bridge</button>
        <p id="ping-response" style="margin-top: 10px; font-size: 12px;"></p>
    </div>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">Login</h2>
            <div id="auth-error" class="auth-error"></div>

            <div class="auth-field">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" placeholder="3-32 characters">
            </div>

            <div class="auth-field">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Min 8 characters">
            </div>

            <button id="auth-submit-btn" class="auth-btn">Sign In</button>
            <div id="auth-toggle-btn" class="auth-toggle">Need an account? Register</div>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>

</html>
