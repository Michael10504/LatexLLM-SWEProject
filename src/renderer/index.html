<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LaTeX Local LLM Editor</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div id="status-bar">
        <span>Project: Untitled | Role: Owner | Sandbox: Offline</span>
    </div>

    <div id="editor-view">
        <h2>Editor View</h2>
        <!-- CodeMirror 6 will mount here -->
    </div>

    <div id="pdf-preview">
        <h2>PDF Preview</h2>
        <!-- PDF.js canvas will mount here -->
    </div>

    <div id="ai-panel">
        <h2>AI Panel</h2>
        <!-- Sprint 1 AI Tasks 1-5 will mount here -->
        <button id="ping-btn" style="margin-top: 20px; padding: 8px;">Test IPC Bridge</button>
        <p id="ping-response" style="margin-top: 10px; font-size: 12px;"></p>
    </div>

    <script src="./renderer.js"></script>
</body>

</html>
