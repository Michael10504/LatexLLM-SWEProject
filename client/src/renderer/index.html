<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LaTeX Local LLM Editor</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:3443;">
    <link rel="stylesheet" href="./styles.css">

</head>

<body>
    <div id="status-bar">
        <span id="user-status">User: Not Logged In</span>
        <span style="margin-left: auto;">
            <button id="logout-btn"
                style="display: none; padding: 4px 12px; background: #c53030; color: white; border: none; border-radius: 3px; cursor: pointer;">Logout</button>
        </span>
    </div>

    <!-- Workspace Container -->
    <div class="workspace">
        <div id="editor-view"></div>

        <div id="pdf-preview">
            <h2>PDF Preview (Coming Soon)</h2>
        </div>

        <div id="ai-panel">
            <h2>AI Panel</h2>
            <button id="ping-btn" style="margin-top: 20px; padding: 8px;">Test IPC Bridge</button>
            <p id="ping-response" style="margin-top: 10px; font-size: 12px;"></p>
        </div>
    </div>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">Login</h2>
            <div id="auth-error" class="auth-error"></div>

            <div class="auth-field">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" placeholder="3-32 characters">
            </div>

            <div class="auth-field">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Min 8 characters">
            </div>

            <button id="auth-submit-btn" class="auth-btn" type="button">Sign In</button>
            <button id="auth-toggle-btn" class="auth-toggle" type="button">Need an account? Register</button>
        </div>
    </div>

    <!-- Project Selection Overlay -->
    <div id="project-overlay" style="display: none;">
        <div class="auth-card" style="width: 450px;">
            <h2>Your Projects</h2>

            <!-- List Container -->
            <div id="project-list" class="project-list">
                <!-- Projects will be injected here via TypeScript -->
            </div>

            <hr style="border-color: #444; margin: 16px 0;">

            <!-- Create New Project -->
            <div class="auth-field">
                <label for="new-project-name">Create New Project</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="new-project-name" placeholder="Project Name (1-100 chars)" style="flex: 1;">
                    <button id="create-project-btn" class="auth-btn"
                        style="width: auto; padding: 8px 16px;">Create</button>
                </div>
            </div>
            <div id="project-error" class="auth-error"></div>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>

</html>
